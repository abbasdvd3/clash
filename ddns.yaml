ipv6: true
udp: false
udp-idle-timeout: 300
unified-delay: false
tcp-concurrent: true
find-process-mode: always

profile:
  store-selected: true
  store-fake-ip: true
geodata-mode: true
geox-url:
  GeoIP: https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geoip.dat
