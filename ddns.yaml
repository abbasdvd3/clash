    interval: 300
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 3
      lazy: false
      Accept: ["*/*"]
      Connection: ["keep-alive"]
      expected-status: 204
      header:
      User-Agent:
      - "Clash/v1.18.0"
      - "mihomo/1.18.3"
      - "meta/0.2.0.9.smart"
