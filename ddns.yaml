rule-providers:
  AdGuardSDNSFilter:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/AdguardTeam/AdGuardSDNSFilter/master/Filters/filter.txt"
    path: "./rule_providers/adguard_sdnsfilter.yaml"
    interval: 86400

  AntiAD:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-domains.txt"
    path: "./rule_providers/antiad_domains.yaml"
    interval: 86400

proxy-groups:
  - name: Master
    type: select
    exclude-type: Direct|Reject|Pass|Compatible|RejectDrop|Dns|Relay|LoadBalance|Trojan
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png"
    lazy: false
    proxies:
      - fallback
      - Auto
      - select
      
  - name: select
    type: select
    include-all: true
    exclude-type: Direct|Reject|Pass|Compatible|RejectDrop|Dns|Relay|LoadBalance|Trojan
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png"
    lazy: false
    proxies:
      
  - name: Auto
    type: url-test
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png"
    include-all: true
    url: https://www.gstatic.com/generate_204
    exclude-type: Direct|Reject|Pass|Compatible|RejectDrop|Dns|Relay|Selector|Fallback|URLTest|LoadBalance|Trojan
    interval: 380
    tolerance: 80
    hidden: true
    lazy: false
    exclude-filter: "(?i)(官网|公告|通知|维护|订阅|防失联|最新网址|备用|客服|工单|联系|反馈|教程|使用说明|购买|续费|充值|返利|推荐|优惠|福利|活动|推广|代理商|机场|节点池|测速|解锁|说明|规则|TG|电报|Master|频道|群|讨论组|t\\.me/|流量|剩余|用量|到期|过期|续期|重置|重设|下次|距离|套餐|账单|有效期|时间|日期|定期|下方|地址|更新|\\bURL\\b|URL@|vpn|👆|👇|👉|⬇|⬆|✈|🛫|🛬|📢|🔗|\\s{4,})"

  - name: fallback
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    hidden: true
    lazy: false
    include-all: true
    exclude-type: Direct|Reject|Pass|Compatible|RejectDrop|Dns|Relay|Selector|Fallback|URLTest|LoadBalance|Trojan
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

  - name: iran
    type: select
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google.png"
    proxies: [DIRECT, Auto, Master]


