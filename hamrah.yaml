socks-port: 7891
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898
mode: rule
ipv6: true
allow-lan: true
log-level: debug
external-controller: 0.0.0.0:9090
external-controller-tls: 0.0.0.0:9443 
secret: "0000" 
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true
external-controller-unix: mihomo.sock
external-controller-pipe: \\.\pipe\mihomo
external-controller-routing-mark: 0
external-ui: /dashboard
external-ui-name: xd
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-doh-server: /dns-query
keep-alive-interval: 30
find-process-mode: strict
skip-auth-prefixes: 
  - 127.0.0.1/8
  - ::1/128
lan-allowed-ips: 
  - 0.0.0.0/0
  - ::/0
lan-disallowed-ips:
  - 192.168.0.3/32
unified-delay: false
tcp-concurrent: true
geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
etag-support: true
geox-url:
  GeoIP: https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geoip.dat
  GeoSite: https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geosite.dat
  mmdb: https://raw.githubusercontent.com/Chocolate4U/Iran-clash-rules/release/geoip.metadb
  ANS: https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/geolite2/GeoLite2-ASN.mmdb

profile:
  store-selected: true
  store-fake-ip: true
experimental:
  quic-go-disable-gso: true
  quic-go-disable-ecn: true
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: true
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  listen: 0.0.0.0:5591
  ipv6: true
  default-nameserver:
    - tls://223.5.5.5
    - tls://8.8.8.8
    - tls://1.1.1.1
  enhanced-mode: fake-ip
  fake-ip-range: 22.0.0.0/8
  fake-ip-ttl: 1
  # fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*.lan'
  nameserver-policy:
    '+.arpa': '10.0.0.1'
    'rule-set:ir':
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    'www.createporn.com': 
    - tls://223.5.5.5
    - tls://dot.pub
    - tls://8.8.4.4
    - tls://1.1.1.1
    'www.openai.com': 
    - https://doh.pub/dns-query
    - 8.8.8.8
    - https://dns.alidns.com/dns-query
  rule-set:nsfw,social: 8.8.8.8
  geosite:category-ads-all: rcode://success
  nameserver:
    - 8.8.8.8
    - 1.1.1.1
    - 86.54.11.100
    - 86.54.11.200
    - 104.21.83.62
    - 172.67.214.246
  fallback:
    - tls://8.8.4.4
    - tls://1.1.1.1
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://sky.rethinkdns.com/dns-query
    - https://unfiltered.joindns4.eu/dns-query
  proxy-server-nameserver-policy:
    'www.yournode.com': '114.114.114.114'
    'www.createporn.com': '8.8.8.8'
    'www.openai.com': '114.114.114.114'
  direct-nameserver:
    - system
  direct-nameserver-follow-policy: false
  fallback-filter:
    geoip: false
    geoip-code: ir
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
      - 127.0.0.1/32
      - 100.64.0.0/10
    domain:
  #    - '+.google.com'
    #  - '+.facebook.com'
   #   - '+.youtube.com'
    fallback-lazy-query: false
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  device: utun0
  mtu: 9000
  strict-route: false
