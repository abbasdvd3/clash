proxy-groups:
  - name: PROXY
    type: select
    icon: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/icon/qure/color/Rocket.png
    include-all: true
    exclude-type: Reject|Pass|Compatible|RejectDrop|Dns|Trojan
    exclude-filter: "(?i)(英国|\\bUK\\b|🇬🇧|HongKong|HK|香港|Singapore|SG|新加坡Taiwan|TW|台湾|Germany|Deutsch|DE|德国|United\\s*Kingdom)"
    proxies:
      - 🟢Auto🟢
      - 🟡fallback🟡
      - 🔴load-balance🔴
      - 🟢US Node🟢

  - name: 🟢Auto🟢
    type: url-test
    hidden: false
    exclude-filter: "(?i)(英国|\\bUK\\b|🇬🇧|HongKong|HK|香港|Singapore|SG|新加坡Taiwan|TW|台湾|Germany|Deutsch|DE|德国|United\\s*Kingdom)"
    exclude-type: Direct, Reject, RejectDrop, Compatible, Pass, PassRule, Rematch, Dns, Relay, Selector, Fallback, URLTest, LoadBalance, Smart, Shadowsocks, ShadowsocksR, Snell, Trojan, Ssh, Masque, TrustTunnel, ShadowQuic, OpenVPN, Tailscale, ZeroTier, EasyTier, GostRelay
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    icon: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/icon/qure/color/Auto.png
    
  - name: 🟡fallback🟡
    type: fallback
    hidden: true
    exclude-filter: "(?i)(英国|\\bUK\\b|🇬🇧|HongKong|HK|香港|Singapore|SG|新加坡Taiwan|TW|台湾|Germany|Deutsch|DE|德国|United\\s*Kingdom)"
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    exclude-type: Direct, Reject, RejectDrop, Compatible, Pass, PassRule, Rematch, Dns, Relay, Selector, Fallback, URLTest, LoadBalance, Smart, Shadowsocks, ShadowsocksR, Snell, Trojan, Ssh, Masque, TrustTunnel, ShadowQuic, OpenVPN, Tailscale, ZeroTier, EasyTier, GostRelay
    icon: http://raw.gitmirror.com/Koolson/Qure/master/IconSet/Color/Airport.png
    
  - name: 🔴load-balance🔴
    type: load-balance
    hidden: true
    exclude-filter: "(?i)(英国|\\bUK\\b|🇬🇧|HongKong|HK|香港|Singapore|SG|新加坡Taiwan|TW|台湾|Germany|Deutsch|DE|德国|United\\s*Kingdom)"
    exclude-type: Direct, Reject, RejectDrop, Compatible, Pass, PassRule, Rematch, Dns, Relay, Selector, Fallback, URLTest, LoadBalance, Smart, Shadowsocks, ShadowsocksR, Snell, Trojan, Ssh, Masque, TrustTunnel, ShadowQuic, OpenVPN, Tailscale, ZeroTier, EasyTier, GostRelay
    include-all: true
    url: "https://www.gstatic.com/generate_204"
    icon: http://raw.gitmirror.com/Koolson/Qure/master/IconSet/Color/Airport.png
    
  - name: 🟢US Node🟢
    type: url-test
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png"
    include-all: true
    exclude-type: Direct, Reject, RejectDrop, Compatible, Pass, PassRule, Rematch, Dns, Relay, Selector, Fallback, URLTest, LoadBalance, Smart, Shadowsocks, ShadowsocksR, Snell, Trojan, Ssh, Masque, TrustTunnel, ShadowQuic, OpenVPN, Tailscale, ZeroTier, EasyTier, GostRelay
    filter: "(?i)(英国|\\bUK\\b|🇬🇧|HongKong|HK|香港|Singapore|SG|新加坡Taiwan|TW|台湾|Germany|Deutsch|DE|德国|United\\s*Kingdom)"
    exclude-filter: "(?i)(官网|公告|通知|维护|订阅|防失联|TG|telegram|频道|群|讨论组|t\\.me/|流量|剩余|到期|重置|下次|距离|套餐|定期|下方|地址|更新|URL@|vpn|👇|👆|👉|✈|📢|\\s{4,})"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 80
    lazy: false
    
  - name: 🎯 Direct
    type: select
    disable-udp: true
    icon: http://raw.gitmirror.com/Koolson/Qure/master/IconSet/Color/Airport.png
    proxies:
      - "DIRECT"
      - "PROXY"
      
  - name: "🛑 Reject"
    type: "select"
    icon: "https://fastly.jsdelivr.net/gh/clash-verge-rev/clash-verge-rev.github.io/main/docs/assets/icons/block.svg"
    proxies:
      - "REJECT"
      - "DIRECT"
      - "PROXY"
      
port: 7892
socks-port: 7891
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898
allow-lan: true
log-level: silent
interface-name: ""
mode: rule
external-controller: 127.0.0.1:9090
external-ui: dashboard
external-controller-tls: 127.0.0.1:9091
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
unified-delay: false
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true
  
geodata-mode: true
geodata-loader: standard
find-process-mode: strict
ipv6: true

tun:
  enable: true
  device: Meta
  stack: gvisor
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
  dns-hijack: ['any:53']
  route-exclude-address: []
  mtu: 1500
  
dns:
  enable: true
  listen: 0.0.0.0:5591
  ipv6: true
  prefer-h3: false
  respect-rules: true
  use-system-hosts: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'localhost.ptlogin2.qq.com'
    - 'localhost.sec.qq.com'
    - '+.in-addr.arpa'
    - '+.ip6.arpa'
    - 'time.*.com'
    - 'time.*.gov'
    - 'pool.ntp.org'
    - 'localhost.work.weixin.qq.com'
  default-nameserver:
    - 127.0.0.1:5591
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 127.0.0.1:5591
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    
